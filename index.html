<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>In Every Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@300;400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#030207;color:#fff;font-family:Manrope,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#space{z-index:0}
#fx{z-index:2;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at center,transparent 20%,rgba(0,0,0,.22) 58%,rgba(0,0,0,.82) 100%)}
.aurora{position:fixed;width:70vw;height:70vw;left:50%;top:48%;transform:translate(-50%,-50%);border-radius:50%;z-index:1;pointer-events:none;filter:blur(70px);background:conic-gradient(from 20deg,rgba(255,25,135,.16),rgba(130,55,255,.13),rgba(30,160,255,.08),rgba(255,25,135,.16));animation:spin 20s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ui{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.center{position:relative;width:min(900px,92vw);transform-style:preserve-3d;transition:transform .12s ease-out}
.kicker{font-size:10px;letter-spacing:9px;text-transform:uppercase;color:rgba(255,255,255,.46);margin-bottom:28px;opacity:0;animation:up 1.4s 2.2s forwards}
.title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(82px,15vw,190px);font-weight:500;line-height:.72;letter-spacing:-7px;background:linear-gradient(105deg,#fff 10%,#ffd9eb 35%,#ff5ca7 55%,#b986ff 76%,#fff 95%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(255,62,151,.18));opacity:0;animation:titleIn 2.2s 2.5s cubic-bezier(.16,1,.3,1) forwards,shine 7s 4.5s linear infinite}
@keyframes titleIn{from{opacity:0;filter:blur(18px);transform:scale(.72) translateY(30px)}to{opacity:1;filter:blur(0);transform:scale(1) translateY(0)}}
@keyframes shine{to{background-position:250% center}}
.subtitle{margin-top:38px;color:rgba(255,255,255,.52);font-size:12px;letter-spacing:5px;opacity:0;animation:up 1.4s 3.4s forwards}
@keyframes up{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.enter{pointer-events:auto;margin-top:38px;padding:14px 28px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.035);color:#fff;letter-spacing:4px;font-size:9px;cursor:pointer;backdrop-filter:blur(14px);transition:.4s;opacity:0;animation:up 1.4s 4s forwards}
.enter:hover{transform:translateY(-4px);border-color:rgba(255,110,180,.65);box-shadow:0 18px 60px rgba(255,0,130,.18)}
#intro{position:fixed;inset:0;z-index:50;background:#030207;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:1.6s cubic-bezier(.77,0,.18,1)}
#intro.hide{opacity:0;transform:scale(1.12);pointer-events:none}
.intro-line{width:1px;height:100px;background:linear-gradient(transparent,#fff,transparent);margin-bottom:28px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35;transform:scaleY(.6)}}
.intro-label{font-size:10px;letter-spacing:8px;color:rgba(255,255,255,.42);margin-bottom:30px}
.open{padding:17px 38px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:999px;letter-spacing:5px;font-size:9px;cursor:pointer;transition:.45s}
.open:hover{background:#fff;color:#050208;box-shadow:0 0 50px rgba(255,255,255,.2)}
.audio-ui{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;opacity:0;transition:.8s;pointer-events:none}
.audio-ui.show{opacity:1}
.sound{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
.bars{display:flex;gap:3px;align-items:center;height:20px}
.bars i{width:2px;height:5px;background:#ff5ca7;display:block;animation:bar .8s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.2s}.bars i:nth-child(4){animation-delay:.3s}.bars i:nth-child(5){animation-delay:.15s}
@keyframes bar{to{height:18px}}
.music-text{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.38)}
.flash{position:fixed;inset:0;background:#fff;z-index:40;opacity:0;pointer-events:none}
.flash.hit{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.25}100%{opacity:0}}
.final{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);z-index:11;text-align:center;opacity:0;pointer-events:none;transition:2s}
.final.show{opacity:1}
.final strong{font-family:"Cormorant Garamond",serif;font-size:clamp(25px,4vw,48px);font-style:italic;font-weight:500}
.final small{display:block;margin-top:8px;font-size:8px;letter-spacing:5px;color:rgba(255,255,255,.38)}
@media(max-width:600px){.title{letter-spacing:-4px}.subtitle{letter-spacing:2px}.final{bottom:14%}}
</style>
</head>
<body>
<div id="intro">
  <div class="intro-line"></div>
  <div class="intro-label">A little universe, made for you</div>
  <button class="open" id="open">ENTER</button>
</div>

<canvas id="space"></canvas>
<canvas id="fx"></canvas>
<div class="aurora"></div>
<div class="vignette"></div>

<div class="ui">
  <div class="center" id="center">
    <div class="kicker">Three words. Infinite meaning.</div>
    <h1 class="title">I Love You</h1>
    <div class="subtitle">IN THIS UNIVERSE &nbsp;•&nbsp; AND EVERY OTHER ONE</div>
    <button class="enter" id="wish">MAKE A WISH</button>
  </div>
</div>

<div class="final" id="final">
  <strong>In every universe, I would still choose you.</strong>
  <small>WITH ALL MY HEART</small>
</div>

<div class="audio-ui" id="audioUi">
  <button class="sound" id="sound">Ⅱ</button>
  <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
  <span class="music-text">PLAYING YOUR SONG</span>
</div>

<div class="flash" id="flash"></div>
<audio id="music" src="love.mp3" preload="auto" loop></audio>

<script>
const space=document.getElementById("space"), fx=document.getElementById("fx");
const s=space.getContext("2d"), f=fx.getContext("2d");
let W,H,dpr,stars=[],particles=[],running=false;
const mouse={x:.5,y:.5,tx:.5,ty:.5};

function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  for(const c of [space,fx]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px"}
  s.setTransform(dpr,0,0,dpr,0,0);f.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.min(420,Math.floor(W*H/4200))},()=>({
    x:Math.random()*W,y:Math.random()*H,z:Math.random(),r:.4+Math.random()*1.7,a:.15+Math.random()*.8,tw:Math.random()*6.28
  }));
}
addEventListener("resize",resize);resize();

function starField(t){
  s.clearRect(0,0,W,H);
  const gx=W*.5+(mouse.x-.5)*-35, gy=H*.5+(mouse.y-.5)*-25;
  for(const p of stars){
    p.tw+=.01;
    const a=p.a*(.55+.45*Math.sin(p.tw));
    s.fillStyle=`rgba(255,${185+Math.floor(p.z*70)},${225+Math.floor(p.z*30)},${a})`;
    s.beginPath();s.arc(p.x+(gx-W*.5)*p.z*.08,p.y+(gy-H*.5)*p.z*.08,p.r*p.z+.3,0,Math.PI*2);s.fill();
  }
  const g=s.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.min(W,H)*.48);
  g.addColorStop(0,"rgba(255,40,150,.055)");g.addColorStop(.5,"rgba(120,50,255,.025)");g.addColorStop(1,"transparent");
  s.fillStyle=g;s.fillRect(0,0,W,H);
}

const MAX_PARTICLES = 900;
function burst(cx,cy,count=160,power=1){
  count = Math.min(count, MAX_PARTICLES - particles.length);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const speed=(.7+Math.random()*4.2)*power;
    if(particles.length>650) particles.splice(0, Math.max(0, particles.length-650));
    particles.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
      life:1,max:.55+Math.random()*1.3,size:.7+Math.random()*2.8,
      hue:315+Math.random()*55,drag:.975+Math.random()*.018});
  }
}

function drawFx(){
  f.clearRect(0,0,W,H);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy*=p.drag;p.vy+=.012;
    p.life-=.012;
    if(p.life<=0){particles.splice(i,1);continue}
    f.fillStyle=`hsla(${p.hue},100%,${70+p.life*25}%,${Math.min(1,p.life*1.4)})`;
    f.beginPath();f.arc(p.x,p.y,p.size*(.5+p.life),0,Math.PI*2);f.fill();
  }
  
}

function animate(t){
  mouse.x+=(mouse.tx-mouse.x)*.045;mouse.y+=(mouse.ty-mouse.y)*.045;
  starField(t);drawFx();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener("pointermove",e=>{
  mouse.tx=e.clientX/W;mouse.ty=e.clientY/H;
  document.getElementById("center").style.transform=
    `translate3d(${(mouse.x-.5)*18}px,${(mouse.y-.5)*-12}px,0) rotateY(${(mouse.x-.5)*5}deg) rotateX(${(mouse.y-.5)*-4}deg)`;
});

const intro=document.getElementById("intro"),music=document.getElementById("music"),audioUi=document.getElementById("audioUi");
document.getElementById("open").onclick=async()=>{
  intro.classList.add("hide");
  try{await music.play();audioUi.classList.add("show")}catch(e){}
  requestAnimationFrame(()=>burst(W/2,H/2,180,.95));
};

document.getElementById("sound").onclick=()=>{
  if(music.paused){music.play();document.getElementById("sound").textContent="Ⅱ"}
  else{music.pause();document.getElementById("sound").textContent="▶"}
};

document.getElementById("wish").onclick=()=>{
  document.getElementById("flash").classList.remove("hit");
  void document.getElementById("flash").offsetWidth;
  document.getElementById("flash").classList.add("hit");
  burst(W/2,H*.43,520,1.55);
  for(let i=0;i<3;i++)setTimeout(()=>burst(W/2,H*.43,110,1.0),i*180);
  setTimeout(()=>document.getElementById("final").classList.add("show"),1100);
};
</script>
</body>
</html>
